<!doctype html>
<html><head><meta charset="utf-8"><title>Radii & Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans)}
  .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}
  .row{display:flex;gap:14px;margin-bottom:18px;align-items:flex-end}
  .card{width:80px;height:60px;background:#fff;border:1px solid var(--border-1);display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:10px;color:var(--fg-3);font-weight:600}
  .sh{width:120px;height:58px;background:#fff;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;padding:6px;font-size:10px;color:var(--fg-3);font-weight:600;border:1px solid var(--border-1)}
</style>
</head><body>
  <div class="lab">Radii</div>
  <div class="row">
    <div class="card" style="border-radius:4px">xs · 4</div>
    <div class="card" style="border-radius:6px">sm · 6</div>
    <div class="card" style="border-radius:10px">md · 10</div>
    <div class="card" style="border-radius:14px">lg · 14</div>
    <div class="card" style="border-radius:18px">xl · 18</div>
    <div class="card" style="border-radius:24px">2xl · 24</div>
    <div class="card" style="border-radius:999px">full</div>
  </div>
  <div class="lab">Shadows</div>
  <div class="row" style="background:#f5f2e3;padding:18px;border-radius:14px;margin:0 -4px">
    <div class="sh" style="box-shadow:var(--shadow-xs)">xs</div>
    <div class="sh" style="box-shadow:var(--shadow-sm)">sm</div>
    <div class="sh" style="box-shadow:var(--shadow-md)">md</div>
    <div class="sh" style="box-shadow:var(--shadow-lg)">lg</div>
    <div class="sh" style="box-shadow:var(--shadow-brand);border-color:#7E8C54">brand</div>
  </div>
</body></html>
