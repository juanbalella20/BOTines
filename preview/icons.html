<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
<style>
  body{margin:0;padding:22px;background:#fff;font-family:-apple-system,system-ui,sans-serif}
  .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9CA3AF;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:16px}
  .t{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:10px;background:#F9FAFB;border:1px solid #E5E7EB}
  .t i{font-size:18px;color:#4B5563}
  .t span{font-size:9px;color:#6B7280;font-weight:600;text-align:center}
</style>
</head><body>
  <div class="lab">FontAwesome 6 — product vocabulary</div>
  <div class="grid">
    <div class="t"><i class="far fa-calendar-alt"></i><span>calendar</span></div>
    <div class="t"><i class="fas fa-map-marked-alt"></i><span>courts</span></div>
    <div class="t"><i class="fas fa-running"></i><span>activities</span></div>
    <div class="t"><i class="fas fa-bell"></i><span>notifications</span></div>
    <div class="t"><i class="fas fa-users"></i><span>clients</span></div>
    <div class="t"><i class="fas fa-clipboard-list"></i><span>reservations</span></div>
    <div class="t"><i class="fas fa-chart-line"></i><span>finance</span></div>
    <div class="t"><i class="fas fa-cog"></i><span>settings</span></div>
    <div class="t"><i class="fas fa-futbol"></i><span>brand · football</span></div>
    <div class="t"><i class="fas fa-pencil-alt"></i><span>edit</span></div>
    <div class="t"><i class="fas fa-trash-alt"></i><span>delete</span></div>
    <div class="t"><i class="fas fa-plus"></i><span>add</span></div>
    <div class="t"><i class="fas fa-times"></i><span>close</span></div>
    <div class="t"><i class="fas fa-check"></i><span>confirm</span></div>
    <div class="t"><i class="fab fa-whatsapp" style="color:#25D366"></i><span>whatsapp</span></div>
    <div class="t"><i class="fas fa-dollar-sign"></i><span>price</span></div>
  </div>
</body></html>
