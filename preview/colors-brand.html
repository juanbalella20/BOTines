<!doctype html>
<html><head><meta charset="utf-8"><title>Brand palette</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .col{display:flex;flex-direction:column;gap:10px}
  .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:4px}
  .row{display:flex;gap:8px}
  .sw{flex:1;border-radius:10px;border:1px solid var(--border-1);padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:58px}
  .sw .name{font-size:11px;font-weight:600}
  .sw .hex{font-size:10px;opacity:.7;font-variant-numeric:tabular-nums;margin-top:16px}
</style>
</head><body>
<div class="wrap">
  <div class="col">
    <div class="lab">Marketing · Olive + Cream</div>
    <div class="row">
      <div class="sw" style="background:#7E8C54;color:#fff;border-color:transparent"><span class="name">Olive · Primary</span><span class="hex">#7E8C54</span></div>
      <div class="sw" style="background:#636F42;color:#fff;border-color:transparent"><span class="name">Olive · Dark</span><span class="hex">#636F42</span></div>
      <div class="sw" style="background:#4A5530;color:#fff;border-color:transparent"><span class="name">Olive · Deep</span><span class="hex">#4A5530</span></div>
    </div>
    <div class="row">
      <div class="sw" style="background:#E6E9D6;color:#4A5530"><span class="name">Olive · Soft</span><span class="hex">#E6E9D6</span></div>
      <div class="sw" style="background:#EDE8D0;color:#4A5530"><span class="name">Cream</span><span class="hex">#EDE8D0</span></div>
      <div class="sw" style="background:#F5F2E3;color:#4A5530"><span class="name">Cream · Soft</span><span class="hex">#F5F2E3</span></div>
    </div>
  </div>
  <div class="col">
    <div class="lab">Product · Green</div>
    <div class="row">
      <div class="sw" style="background:#4ade80;color:#14532d;border-color:transparent"><span class="name">Botines · Light</span><span class="hex">#4ADE80</span></div>
      <div class="sw" style="background:#16a34a;color:#fff;border-color:transparent"><span class="name">Botines</span><span class="hex">#16A34A</span></div>
      <div class="sw" style="background:#14532d;color:#fff;border-color:transparent"><span class="name">Botines · Dark</span><span class="hex">#14532D</span></div>
    </div>
    <div class="row">
      <div class="sw" style="background:#25D366;color:#fff;border-color:transparent"><span class="name">WhatsApp</span><span class="hex">#25D366</span></div>
      <div class="sw" style="background:#ECE5DD;color:#075E54"><span class="name">WA · Chat bg</span><span class="hex">#ECE5DD</span></div>
      <div class="sw" style="background:#DCF8C6;color:#075E54"><span class="name">WA · Bubble</span><span class="hex">#DCF8C6</span></div>
    </div>
  </div>
</div>
</body></html>
