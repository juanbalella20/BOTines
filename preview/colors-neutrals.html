<!doctype html>
<html><head><meta charset="utf-8"><title>Neutrals & semantic</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
  .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:0 0 8px}
  .ramp{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--border-1);margin-bottom:14px}
  .step{flex:1;padding:14px 6px;text-align:center;font-size:10px;font-weight:600}
  .step .v{font-size:9px;opacity:.65;margin-top:2px;font-variant-numeric:tabular-nums}
  .sem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pill{border-radius:10px;border:1px solid;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:999px}
</style>
</head><body>
  <div class="lab">Neutrals · Gray 50 → 900</div>
  <div class="ramp">
    <div class="step" style="background:#F9FAFB;color:#111">50<div class="v">#F9FAFB</div></div>
    <div class="step" style="background:#F3F4F6;color:#111">100<div class="v">#F3F4F6</div></div>
    <div class="step" style="background:#E5E7EB;color:#111">200<div class="v">#E5E7EB</div></div>
    <div class="step" style="background:#D1D5DB;color:#111">300<div class="v">#D1D5DB</div></div>
    <div class="step" style="background:#9CA3AF;color:#111">400<div class="v">#9CA3AF</div></div>
    <div class="step" style="background:#6B7280;color:#fff">500<div class="v">#6B7280</div></div>
    <div class="step" style="background:#4B5563;color:#fff">600<div class="v">#4B5563</div></div>
    <div class="step" style="background:#374151;color:#fff">700<div class="v">#374151</div></div>
    <div class="step" style="background:#1F2937;color:#fff">800<div class="v">#1F2937</div></div>
    <div class="step" style="background:#111827;color:#fff">900<div class="v">#111827</div></div>
  </div>
  <div class="lab">Semantic states</div>
  <div class="sem">
    <div class="pill" style="background:#DCFCE7;border-color:#BBF7D0;color:#15803d"><span class="dot" style="background:#22C55E"></span>Success</div>
    <div class="pill" style="background:#FEF9C3;border-color:#FDE68A;color:#854d0e"><span class="dot" style="background:#F59E0B"></span>Warning</div>
    <div class="pill" style="background:#FEE2E2;border-color:#FECACA;color:#991b1b"><span class="dot" style="background:#EF4444"></span>Danger</div>
    <div class="pill" style="background:#DBEAFE;border-color:#BFDBFE;color:#1e40af"><span class="dot" style="background:#3B82F6"></span>Info</div>
  </div>
</body></html>
