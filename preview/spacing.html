<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:22px;background:#fff;font-family:var(--font-sans)}
  .lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:0 0 10px}
  .scale{display:flex;flex-direction:column;gap:6px}
  .r{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--fg-2);font-weight:600}
  .r .n{width:52px;color:var(--fg-3)}
  .r .bar{background:#7E8C54;height:10px;border-radius:3px}
  .r .px{color:var(--fg-3);font-weight:500;font-variant-numeric:tabular-nums}
</style>
</head><body>
<div class="lab">Spacing scale — 4px base grid</div>
<div class="scale">
  <div class="r"><span class="n">space-1</span><span class="bar" style="width:4px"></span><span class="px">4px</span></div>
  <div class="r"><span class="n">space-2</span><span class="bar" style="width:8px"></span><span class="px">8px</span></div>
  <div class="r"><span class="n">space-3</span><span class="bar" style="width:12px"></span><span class="px">12px</span></div>
  <div class="r"><span class="n">space-4</span><span class="bar" style="width:16px"></span><span class="px">16px</span></div>
  <div class="r"><span class="n">space-6</span><span class="bar" style="width:24px"></span><span class="px">24px</span></div>
  <div class="r"><span class="n">space-8</span><span class="bar" style="width:32px"></span><span class="px">32px</span></div>
  <div class="r"><span class="n">space-12</span><span class="bar" style="width:48px"></span><span class="px">48px</span></div>
  <div class="r"><span class="n">space-16</span><span class="bar" style="width:64px"></span><span class="px">64px</span></div>
  <div class="r"><span class="n">space-24</span><span class="bar" style="width:96px"></span><span class="px">96px · section rhythm</span></div>
</div>
</body></html>
