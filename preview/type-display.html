<!doctype html>
<html><head><meta charset="utf-8"><title>Type — display</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
  .row{display:flex;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid var(--border-1)}
  .row:last-child{border-bottom:0}
  .meta{font-size:10px;color:var(--fg-3);font-weight:600;letter-spacing:.08em;text-transform:uppercase;min-width:110px}
  .sample{font-weight:800;letter-spacing:-0.02em;color:var(--fg-1);line-height:1}
</style>
</head><body>
  <div class="row"><div class="meta">Display XL · 72/800</div><div class="sample" style="font-size:56px">Reservations on autopilot</div></div>
  <div class="row"><div class="meta">Display LG · 56/800</div><div class="sample" style="font-size:44px">Book via WhatsApp.</div></div>
  <div class="row"><div class="meta">Display MD · 44/700</div><div class="sample" style="font-size:34px">Own the calendar.</div></div>
</body></html>
